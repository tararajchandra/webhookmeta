<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; height: 100vh; overflow: hidden; }
        .chat-container { height: 100vh; display: flex; }
        .sidebar { width: 30%; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #f0f2f5; border-bottom: 1px solid #ddd; font-weight: bold; }
        .contact-list { flex: 1; overflow-y: auto; }
        .contact-item { padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .contact-item:hover { background: #f5f6f6; }
        .contact-item.active { background: #ebebeb; }
        
        .chat-area { width: 70%; display: flex; flex-direction: column; background: #efeae2; }
        .chat-header { padding: 15px; background: #f0f2f5; border-bottom: 1px solid #ddd; font-weight: bold; display: flex; align-items: center; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .message { max-width: 65%; padding: 10px 15px; border-radius: 7.5px; margin-bottom: 10px; font-size: 14px; line-height: 1.4; position: relative; clear: both; }
        .message.received { background: #fff; align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .message-time { font-size: 10px; color: #667781; display: block; text-align: right; margin-top: 5px; }
        
        .chat-input { padding: 15px; background: #f0f2f5; display: flex; align-items: center; }
        .chat-input input { flex: 1; border: none; padding: 12px 15px; border-radius: 8px; margin-right: 10px; outline: none; }
        .chat-input button { background: #00a884; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .chat-input button:hover { background: #008f6f; }
        
        .no-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: #888; font-size: 18px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="sidebar">
        <div class="sidebar-header">
            Live Inbox Contacts
        </div>
        <div class="contact-list" id="contact-list">
            <!-- Contacts loaded via JS -->
        </div>
    </div>
    
    <div class="chat-area" id="chat-area" style="display: none;">
        <div class="chat-header" id="chat-header">
            Select a contact
        </div>
        <div class="messages" id="messages">
            <!-- Messages loaded via JS -->
        </div>
        <div class="chat-input">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    
    <div class="no-chat" id="no-chat">
        Select a contact to start chatting
    </div>
</div>

<script>
    let currentPhone = null;

    async function loadContacts() {
        const res = await fetch('/api/contacts');
        const contacts = await res.json();
        const list = document.getElementById('contact-list');
        list.innerHTML = '';
        
        contacts.forEach(c => {
            const div = document.createElement('div');
            div.className = `contact-item ${currentPhone === c.phone_number ? 'active' : ''}`;
            div.onclick = () => selectContact(c.phone_number, c.sender_name);
            div.innerHTML = `
                <div class="fw-bold">${c.sender_name}</div>
                <div class="text-muted small">${c.phone_number}</div>
            `;
            list.appendChild(div);
        });
    }

    async function selectContact(phone, name) {
        currentPhone = phone;
        document.getElementById('no-chat').style.display = 'none';
        document.getElementById('chat-area').style.display = 'flex';
        document.getElementById('chat-header').innerText = `${name} (${phone})`;
        
        // Refresh contacts to update active state
        loadContacts();
        loadMessages();
    }

    async function loadMessages() {
        if (!currentPhone) return;
        const res = await fetch(`/api/messages/${currentPhone}`);
        const messages = await res.json();
        
        const container = document.getElementById('messages');
        container.innerHTML = '';
        
        messages.forEach(m => {
            const div = document.createElement('div');
            div.className = `message ${m.is_from_us ? 'sent' : 'received'}`;
            div.innerHTML = `
                ${m.message_text.replace(/\n/g, '<br>')}
                <span class="message-time">${m.received_at}</span>
            `;
            container.appendChild(div);
        });
        
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || !currentPhone) return;
        
        input.value = 'Sending...';
        input.disabled = true;
        
        const res = await fetch('/api/send_message', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone_number: currentPhone, message_text: text })
        });
        
        input.value = '';
        input.disabled = false;
        input.focus();
        
        if (res.ok) {
            loadMessages();
        } else {
            const data = await res.json();
            alert("Error sending message: " + data.message);
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    // Auto refresh
    setInterval(() => {
        loadContacts();
        if (currentPhone) loadMessages();
    }, 5000);

    // Initial load
    loadContacts();
</script>

</body>
</html>
